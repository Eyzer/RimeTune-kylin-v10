[package]
name = "rimetune"
version = "0.3.1"
description = "RimeTune - Rime Configuration Center"
authors = ["Harry"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rimetune"
path = "src/main.rs"

[features]
# Tauri 1 生产构建时 CLI 会传 --features custom-protocol
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
# 使用 Tauri 1.x：Linux 后端依赖 WebKitGTK 4.0（libsoup2），
# 可在麒麟 V10（glibc 2.31、libwebkit2gtk-4.0-37）等老系统上运行。
# Tauri 2.x 强制要求 WebKitGTK 4.1（libsoup3），麒麟 V10 官方源未提供。
tauri = { version = "1", features = ["shell-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = "0.4"
walkdir = "2"
regex = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
